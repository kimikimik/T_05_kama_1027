<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<script src="js/jquery-2.1.3.min.js"></script>
<link rel="stylesheet" href="css/janken.css">
<title>ひとりおそだしじゃんけん</title>
<style>
    .janken-game {
        text-align: center;
    }

    .target-area {
        margin: 24px auto;
    }

    #target_hand,
    .hand-button img {
        width: 120px;
        height: 120px;
        object-fit: contain;
    }

    #target_hand {
        width: 200px;
        height: 200px;
    }

    .player-hands {
        display: flex;
        justify-content: center;
        gap: 12px;
        margin: 24px auto;
    }

    .hand-button,
    #target_button {
        /* border: none; */縁の線
        padding: 8px;
        cursor: pointer;
    }

    #target_button {
        border: none;
        background: transparent;
    }

    .hand-button {
        border-radius: 50%;
    }

    #restart {
        border-radius: 999px;
    }
</style>
</head>
<body>

<header>
  <h2>ひとり<br>de<br>おそだしじゃんけん</h1>
</header>

<main class="janken-game">
  <div class="target-area">
    <p>クリックでじゃんけん！</p>
    <button id="target_button" type="button" aria-label="回転中の手を止める">
      <img id="target_hand" src="./img/01_guu.png" alt="回転する手">
    </button>
  </div>

  <p id="status">勝つ？負ける？あいこ？</p>
  <p id="elapsed"></p>

  <div class="player-hands">
    <button class="hand-button" type="button" data-hand="0" aria-label="グー">
      <img src="./img/01_guu.png" alt="グー">
    </button>
    <button class="hand-button" type="button" data-hand="1" aria-label="チョキ">
      <img src="./img/02_choki.png" alt="チョキ">
    </button>
    <button class="hand-button" type="button" data-hand="2" aria-label="パー">
      <img src="./img/03_paa.png" alt="パー">
    </button>
  </div>

  <button id="restart" type="button">もう一回</button>
</main>

<footer></footer>
<script>
const hands = [
    "./img/01_guu.png",
    "./img/02_choki.png",
    "./img/03_paa.png"
];
let handIndex = 0;
let targetIndex = 0;
let timer;
let isStopped = false;
let isFinished = false;
let stopTime = 0;

function startGame() {
    clearInterval(timer);
    handIndex = 0;
    targetIndex = 0;
    isStopped = false;
    isFinished = false;
    $("#target_hand").attr("src", hands[0]);
    $("#status").html("勝つ？負ける？あいこ？");
    $("#elapsed").html("");

    timer = setInterval(function() {
        targetIndex = handIndex;
        $("#target_hand").attr("src", hands[targetIndex]);
        handIndex = (handIndex + 1) % hands.length;
    }, 100);
}

$("#target_button").on("click", function() {
    if (isStopped) return;

    clearInterval(timer);
    isStopped = true;
    stopTime = Date.now();
    $("#status").html("かって！");
});

$(".hand-button").on("click", function() {
    if (isFinished) return;

    if (!isStopped) {
        $("#status").html("先に上の手を止めてね。");
        return;
    }

    const playerIndex = Number($(this).attr("data-hand"));
    const winningHandIndex = (targetIndex + 2) % 3;

    if (playerIndex === winningHandIndex) {
        const elapsed = Date.now() - stopTime;
        isFinished = true;
        $("#status").html("かったね！");
        $("#elapsed").html("おそだしまで" + (elapsed / 1000).toFixed(2) + "秒");
    } else {
        $("#status").html("ざんねん！");
    }
});

$("#restart").on("click", function() {
    startGame();
});

startGame();
</script>
</body>
</html>
